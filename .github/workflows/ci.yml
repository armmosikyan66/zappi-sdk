name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck and test (spark ${{ matrix.spark }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # lockfile is the dev pin (^0.12.1). 0.11.0 is the web app pin.
        spark: [lockfile, '0.11.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Spark SDK 0.11.0
        if: matrix.spark == '0.11.0'
        run: npm install --no-save --package-lock=false @buildonspark/spark-sdk@0.11.0
      - run: npm run typecheck
      - run: npm test
      - name: Check the browser recovery pack
        if: matrix.spark == 'lockfile'
        run: |
          npm run build
          node scripts/check-recovery-browser.mjs --pack
